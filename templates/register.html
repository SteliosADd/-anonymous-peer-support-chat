{% extends "base.html" %}
{% block title %}Join — Anonymous Mental Health Support Chat{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="auth-card">
        <div class="auth-icon">🌱</div>
        <h2>Join anonymously</h2>
        <p class="auth-sub">We'll give you an anonymous name — no personal info needed.</p>

        <form id="registerForm" class="auth-form">
            <label>Your anonymous name</label>
            <div class="username-suggest">
                <input type="text" id="username" readonly />
                <button type="button" id="shuffleUsername" class="btn btn-ghost" title="Get a different name">🔀</button>
            </div>

            <label>Choose a password</label>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" />

            <label>Pick an avatar</label>
            <div class="avatar-grid" id="avatarGrid"></div>

            <button type="submit" class="btn btn-primary btn-block">Create account</button>
            <p class="auth-error" id="error" style="display:none;"></p>
        </form>

        <p class="auth-alt">
            Already have an account? <a href="/login">Sign in →</a>
        </p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
let selectedAvatar = null;

async function loadSuggestedUsername() {
    const res = await fetch("/api/auth/suggest-username");
    const data = await res.json();
    document.getElementById("username").value = data.username;
}
loadSuggestedUsername();
document.getElementById("shuffleUsername").addEventListener("click", loadSuggestedUsername);

async function loadAvatars() {
    const res = await fetch("/api/auth/avatars");
    const data = await res.json();
    const grid = document.getElementById("avatarGrid");
    data.avatars.forEach((a, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "avatar-btn";
        btn.textContent = a;
        btn.addEventListener("click", () => {
            document.querySelectorAll(".avatar-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            selectedAvatar = a;
        });
        if (i === 0) { btn.classList.add("selected"); selectedAvatar = a; }
        grid.appendChild(btn);
    });
}
loadAvatars();

document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("error");
    err.style.display = "none";
    try {
        const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value,
                avatar: selectedAvatar,
            }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Registration failed");
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));
        // The server may have assigned a different name than the last
        // preview (e.g. if it was taken in the meantime) — show the real one.
        showToast(`Your anonymous name is "${data.user.username}" — remember it to log back in!`, "info", 5000);
        setTimeout(() => { window.location.href = "/chat"; }, 1500);
    } catch (ex) {
        err.textContent = ex.message;
        err.style.display = "block";
    }
});
</script>
{% endblock %}
