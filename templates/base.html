<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}MindSpace — Anonymous Support{% endblock %}</title>
    <meta name="description" content="A safe, anonymous space for peer mental-health support." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">🌿</span>
            <span class="brand-name">MindSpace</span>
        </a>
        <div class="nav-links">
            <a href="/chat" class="nav-link">Chat</a>
            <a href="/resources" class="nav-link">Resources</a>
            <a href="/admin" class="nav-link" id="adminNav" style="display:none;">Admin</a>
            <span id="userBadge" class="user-badge" style="display:none;"></span>
            <a href="/login" class="nav-link nav-cta" id="loginBtn">Sign in</a>
            <button class="nav-link logout-btn" id="logoutBtn" style="display:none;">Sign out</button>
        </div>
    </nav>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>
            MindSpace is a peer-support space — not a substitute for professional help.
            If you're in crisis, please contact a hotline on the
            <a href="/resources">Resources</a> page.
        </p>
    </footer>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
